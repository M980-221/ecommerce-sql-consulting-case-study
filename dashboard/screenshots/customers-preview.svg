<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="title description">
<title id="title">Customers and reviews — Olist static data preview</title>
<desc id="description">Static data preview for customers with eligible sales. Repeat means at least two eligible orders in the window, including same-day purchases; this is not a retention or churn measure. Review comparisons are descriptive.</desc>
<style>text{font-family:Inter,Aptos,"Segoe UI",Arial,sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="1400" height="1040" rx="0" fill="#f6f7f3"/>
<rect x="64" y="29" width="9" height="24" rx="2" fill="#177c78"/>
<text x="85" y="47" font-size="14" font-weight="700" text-anchor="start" fill="#173c43">OLIST  /  E-COMMERCE ANALYSIS</text>
<text x="1336" y="47" font-size="13" font-weight="400" text-anchor="end" fill="#6a7b7c">Mohammed Baquaysh  ·  SQL portfolio</text>
<line x1="64" y1="72" x2="1336" y2="72" stroke="#e1e7e0" stroke-width="1"/>
<text x="64" y="125" font-size="36" font-weight="700" text-anchor="start" fill="#173c43">Customers and reviews</text>
<text x="64" y="156" font-size="15" font-weight="400" text-anchor="start" fill="#6a7b7c">Observed repeat purchases and selected review scores across the reporting window.</text>
