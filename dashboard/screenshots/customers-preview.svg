<text x="864" y="778" font-size="11" font-weight="400" text-anchor="start" fill="#6a7b7c">Descriptive association; review timing varies.</text>
<text x="864" y="798" font-size="11" font-weight="400" text-anchor="start" fill="#6a7b7c">This does not establish a causal effect.</text>
<rect x="64" y="850" width="1272" height="116" rx="10" fill="#fcf0e4"/>
<rect x="64" y="865" width="4" height="86" rx="2" fill="#c67840"/>
<text x="88" y="878" font-size="15" font-weight="700" text-anchor="start" fill="#173c43">Keep review timing and customer follow-up visible</text>
<text x="88" y="904" font-size="13" font-weight="400" text-anchor="start" fill="#6a7b7c">616 sales orders have no eligible selected review; review coverage is 99.31%.</text>
<text x="88" y="926" font-size="13" font-weight="400" text-anchor="start" fill="#6a7b7c">4,274 of 5,972 selected responses on reviewed late orders were submitted before receipt.</text>
<text x="88" y="948" font-size="13" font-weight="400" text-anchor="start" fill="#6a7b7c">Repeat purchasing is observed within this window; later purchasers have less time to buy again.</text>
