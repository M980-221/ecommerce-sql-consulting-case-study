</g>
<g role="group" aria-label="Late deliveries: average score 2.23 out of 5 across 5,972 reviewed orders; 4,274 selected responses precede receipt"><title>Late deliveries: average score 2.23 out of 5 across 5,972 reviewed orders; 4,274 selected responses precede receipt</title>
